name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Windows is experimental until it passes: its result does not fail the workflow.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          # macOS: oldest and newest supported Python only.
          - {os: macos-latest, python: "3.10", experimental: false}
          - {os: macos-latest, python: "3.13", experimental: false}
          - {os: windows-latest, python: "3.12", experimental: true}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Versions
        # The test fixtures encode H.264 with libx264, which must be part of the PyAV build.
        run: python -c "import sys, av, numpy, mcap; print(sys.version); print('PyAV', av.__version__, 'libx264' in av.codecs_available); print('numpy', numpy.__version__)"
      - name: Test
        run: python -m pytest -q

  package:
    name: package (wheel without the decode extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import mcap_frames as mf; print(mf.__version__)"
          /tmp/clean/bin/python -c "import importlib.util as u; assert u.find_spec('av') is None, 'av must not be a core dependency'"
          /tmp/clean/bin/mcap-frames --help
