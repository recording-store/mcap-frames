name: Release

# Pushing a tag vX.Y.Z builds the sdist and wheel and publishes them to PyPI through Trusted Publishing
# (no API token is stored here; PyPI trusts this workflow in the "pypi" environment).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Tag matches the package version
        run: |
          version=$(python -c "import glob; print(glob.glob('dist/*.whl')[0].split('-')[1])")
          echo "tag ${GITHUB_REF_NAME}, package ${version}"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/mcap-frames --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcap-frames
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
